name: Feature request
description: Have an idea or suggestion? I'd love to hear it!
title: "[💡]: "
labels: ["enhancement"]
assignees: ["0nis"]

body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature, idea, or change you'd like.
      placeholder: Leave a suggestion
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
      description: Optional, but helpful. What problem would this solve, or what would it improve?
      placeholder: This would help because ...
